<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handy AI - Gesture Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #03020a;
            --accent: #7cffc4;
            --accent2: #ff6bca;
            --accent3: #6bb5ff;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
            --current-accent: var(--accent);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: 'DM Mono', monospace; 
            overflow: hidden; 
            width: 100vw; height: 100vh;
            position: fixed; /* Mobil kaydırmayı engellemek için */
        }

        /* Gürültü Katmanı */
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; opacity: 0.025;
        }

        .top-stripe {
            position: fixed; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--current-accent); z-index: 1000;
            transition: background 0.3s ease; box-shadow: 0 0 15px var(--current-accent);
        }

        /* Video ve Canvas Katmanları */
        canvas, video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        
        /* Kendini görmen için parlaklığı artırdım (0.3 -> 0.6) */
        video { 
            transform: scaleX(-1); 
            filter: brightness(0.6) contrast(1.1); 
            z-index: 1; 
        }
        #bgCanvas { z-index: 2; opacity: 0.4; pointer-events: none; } /* Matrix yağmuru transparanlığı */
        #fxCanvas { z-index: 3; pointer-events: none; }
        #drawCanvas { z-index: 4; pointer-events: none; }

        /* Giriş Ekranı */
        #splash {
            position: fixed; inset: 0; z-index: 2000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease; padding: 20px; text-align: center;
        }
        .logo {
            font-family: 'Syne', sans-serif; font-size: 3.5rem; font-weight: 800;
            background: linear-gradient(to right, var(--accent), var(--accent3), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem; letter-spacing: -2px;
        }
        .subtitle { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 2rem; }
        
        .rings-container { position: relative; height: 200px; width: 200px; display: flex; align-items: center; justify-content: center; }
        .ring {
            position: absolute; border: 1px solid var(--accent); border-radius: 50%; opacity: 0.3;
            animation: pulse 4s infinite ease-out;
        }
        @keyframes pulse {
            0% { width: 0; height: 0; opacity: 0.8; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }

        .btn-enter {
            padding: 1rem 2.5rem; border-radius: 50px; border: none;
            background: var(--accent); color: #000; font-family: 'Syne', sans-serif;
            font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 0 30px rgba(124, 255, 196, 0.4);
            margin-top: 20px;
        }

        /* Üst Bar - Mobil Uyumlu */
        .top-bar {
            position: fixed; top: 15px; left: 0; width: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .brand { font-family: 'Syne', sans-serif; font-size: 1.2rem; background: linear-gradient(to right, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .mode-switcher {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border);
            padding: 4px; border-radius: 100px; display: flex; gap: 4px;
        }
        .mode-btn {
            background: transparent; border: none; color: #aaa; padding: 8px 16px; border-radius: 100px;
            cursor: pointer; font-family: 'DM Mono', monospace; font-size: 0.75rem; transition: all 0.3s;
        }
        .mode-btn.active { color: white; background: var(--current-accent); box-shadow: 0 0 15px var(--current-accent); }

        /* Bilgi Çipleri */
        .chips { position: fixed; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .chip { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 4px 10px; border-radius: 100px; font-size: 0.6rem; text-align: right; }

        /* Alt Panel */
        .bottom-hud {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border);
            padding: 8px 20px; border-radius: 100px; display: flex; align-items: center; gap: 10px;
            width: max-content; max-width: 90vw;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
        #gestureLabel { font-size: 0.7rem; white-space: nowrap; }

        /* Bildirim Toast */
        #toast {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            z-index: 500; font-family: 'Syne', sans-serif; font-size: 2.5rem; opacity: 0;
            pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; width: 100%;
        }
        #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Temizleme Butonu */
        #clearBtn {
            position: fixed; bottom: 80px; right: 20px; z-index: 101;
            padding: 8px 16px; border-radius: 50px; border: 1px solid var(--accent3);
            background: rgba(107, 181, 255, 0.2); color: white; cursor: pointer;
            display: none; font-family: 'DM Mono'; font-size: 0.7rem;
        }

        .copyright {
            position: fixed; bottom: 5px; right: 10px; z-index: 2001;
            font-size: 9px; opacity: 0.6; color: white; text-decoration: none;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <svg class="noise"><filter id="n"><feFractalNoise type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
    <div class="top-stripe"></div>

    <div id="splash">
        <div class="rings-container">
            <div class="ring" style="animation-delay: 0s"></div>
            <div class="ring" style="animation-delay: 1s"></div>
            <div class="logo">Handy AI</div>
        </div>
        <div class="subtitle">Gesture Intelligence</div>
        <button class="btn-enter" onclick="initApp()">DENEYİMİ BAŞLAT</button>
        <p style="margin-top: 1.5rem; font-size: 0.6rem; color: #666; max-width: 250px;">Kamera erişimi gereklidir. Lütfen izin verin.</p>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="bgCanvas"></canvas>
    <canvas id="fxCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>

    <div class="top-bar">
        <div class="brand">Handy AI</div>
        <div class="mode-switcher">
            <button class="mode-btn active" onclick="setMode('play', this)">PLAY</button>
            <button class="mode-btn" onclick="setMode('shapes', this)">SHAPES</button>
            <button class="mode-btn" onclick="setMode('write', this)">WRITE</button>
        </div>
    </div>

    <div class="chips">
        <div class="chip">FPS: <span id="fps">00</span></div>
        <div class="chip">HANDS: <span id="handCount">0</span></div>
    </div>

    <div id="toast"></div>

    <div class="bottom-hud">
        <div class="dot"></div>
        <div id="gestureLabel">SİSTEM HAZIR</div>
    </div>

    <button id="clearBtn" onclick="clearCanvas()">TEMİZLE</button>

    <a href="https://www.instagram.com/mithun.ai.lab/" class="copyright" target="_blank">Created by Mithun AI Lab</a>

    <script>
        /**
         * HANDY AI - MOBİL UYUMLU SÜRÜM
         * Created by Mithun AI Lab
         * https://www.instagram.com/mithun.ai.lab/
         */

        const config = {
            colors: { play: '#7cffc4', shapes: '#ff6bca', write: '#6bb5ff' }
        };

        let currentMode = 'play';
        let hands, camera;
        let lastResults = null;
        let audioCtx;
        
        const video = document.getElementById('webcam');
        const bgCanvas = document.getElementById('bgCanvas');
        const fxCanvas = document.getElementById('fxCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fxCtx = fxCanvas.getContext('2d');
        const drawCtx = drawCanvas.getContext('2d');

        let particles = [];
        let ripples = [];
        let paths = [];
        let activePath = [];
        let lastFrameTime = 0;

        // Matrix Rain
        const matrixChars = "ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓ".split("");
        let drops = [];
        function initMatrix() {
            const columns = Math.floor(window.innerWidth / 20);
            drops = Array(columns).fill(1);
        }

        async function initApp() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => document.getElementById('splash').style.display = 'none', 800);
            
            try {
                initAudio();
                await initVision();
                initMatrix();
                window.addEventListener('resize', resize);
                resize();
                requestAnimationFrame(render);
            } catch (err) {
                alert("Kamera başlatılamadı: " + err.message);
            }
        }

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type = 'sine', duration = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(g).connect(audioCtx.destination);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        async function initVision() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(results => { lastResults = results; });

            camera = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                width: {ideal: 640}, height: {ideal: 480} // Mobil için daha düşük çözünürlük, daha yüksek FPS
            });
            return camera.start();
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.documentElement.style.setProperty('--current-accent', config.colors[mode]);
            document.getElementById('clearBtn').style.display = mode === 'write' ? 'block' : 'none';
            showToast(mode.toUpperCase() + " MODU");
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.style.color = config.colors[currentMode];
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1200);
        }

        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            [bgCanvas, fxCanvas, drawCanvas].forEach(c => {
                c.width = w; c.height = h;
            });
            initMatrix();
        }

        function getDist(p1, p2) {
            return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
        }

        function render(time) {
            const dt = time - lastFrameTime;
            lastFrameTime = time;
            if (time % 500 < 20) document.getElementById('fps').innerText = Math.round(1000 / dt);

            // Matrix Arka Plan
            bgCtx.fillStyle = 'rgba(3, 2, 10, 0.2)';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = config.colors[currentMode];
            bgCtx.font = "15px 'DM Mono'";
            drops.forEach((y, i) => {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                bgCtx.fillText(text, i * 20, y * 20);
                if (y * 20 > bgCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });

            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            
            if (lastResults && lastResults.multiHandLandmarks) {
                document.getElementById('handCount').innerText = lastResults.multiHandLandmarks.length;
                lastResults.multiHandLandmarks.forEach((landmarks, idx) => {
                    processHand(landmarks, idx, time);
                });
            } else {
                document.getElementById('handCount').innerText = "0";
            }

            drawFX(time);
            requestAnimationFrame(render);
        }

        function processHand(lm, handIdx, time) {
            const w = fxCanvas.width;
            const h = fxCanvas.height;
            const indexTip = { x: (1-lm[8].x) * w, y: lm[8].y * h };
            const thumbTip = { x: (1-lm[4].x) * w, y: lm[4].y * h };

            // İskelet Çizimi (Sadece Play Modunda)
            if (currentMode === 'play') {
                drawSkeleton(lm, handIdx, time);
                const d = getDist(lm[4], lm[8]);
                if (d < 0.06) {
                    if (!lm.pinched) {
                        spawnRipple(indexTip.x, indexTip.y);
                        playSound(440, 'sawtooth');
                        showToast('ZAP!');
                        lm.pinched = true;
                    }
                } else { lm.pinched = false; }
            }

            // Yazma Modu
            if (currentMode === 'write') {
                const isPointing = getDist(lm[8], lm[0]) > 0.2 && getDist(lm[4], lm[8]) > 0.08;
                if (isPointing) {
                    activePath.push({ x: indexTip.x, y: indexTip.y, hue: (time/10)%360 });
                    fxCtx.fillStyle = config.accent3;
                    fxCtx.beginPath(); fxCtx.arc(indexTip.x, indexTip.y, 6, 0, Math.PI*2); fxCtx.fill();
                } else if (activePath.length > 0) {
                    paths.push([...activePath]);
                    activePath = [];
                }
            }

            // Şekil Modu Basit Algılama
            if (currentMode === 'shapes') {
                const isPeace = getDist(lm[8], lm[0]) > 0.2 && getDist(lm[12], lm[0]) > 0.2 && getDist(lm[16], lm[0]) < 0.15;
                if (isPeace) {
                    fxCtx.strokeStyle = config.colors.shapes;
                    fxCtx.lineWidth = 4;
                    fxCtx.beginPath(); fxCtx.arc(indexTip.x, indexTip.y - 50, 30, 0, Math.PI*2); fxCtx.stroke();
                    if (time % 1000 < 20) showToast('PEACE ✌');
                }
            }
        }

        function drawSkeleton(lm, idx, time) {
            const w = fxCanvas.width;
            const h = fxCanvas.height;
            fxCtx.strokeStyle = config.colors.play;
            fxCtx.lineWidth = 2;
            
            // Parmak uçlarını bağla
            const joints = [0, 5, 9, 13, 17, 0];
            fxCtx.beginPath();
            joints.forEach((p, i) => {
                const x = (1-lm[p].x)*w; const y = lm[p].y*h;
                if(i===0) fxCtx.moveTo(x,y); else fxCtx.lineTo(x,y);
            });
            fxCtx.stroke();

            [4, 8, 12, 16, 20].forEach(p => {
                fxCtx.fillStyle = "white";
                fxCtx.beginPath(); fxCtx.arc((1-lm[p].x)*w, lm[p].y*h, 4, 0, Math.PI*2); fxCtx.fill();
            });
        }

        function drawFX(time) {
            // Çizimleri render et
            drawCtx.clearRect(0,0,drawCanvas.width, drawCanvas.height);
            [...paths, activePath].forEach(path => {
                if (path.length < 2) return;
                drawCtx.beginPath();
                drawCtx.strokeStyle = config.colors.write;
                drawCtx.lineWidth = 5;
                drawCtx.lineJoin = 'round';
                drawCtx.moveTo(path[0].x, path[0].y);
                for(let i=1; i<path.length; i++) drawCtx.lineTo(path[i].x, path[i].y);
                drawCtx.stroke();
            });

            // Halkalar
            ripples.forEach((r, i) => {
                r.r += 5; r.a -= 0.03;
                if (r.a <= 0) ripples.splice(i, 1);
                fxCtx.strokeStyle = `rgba(124, 255, 196, ${r.a})`;
                fxCtx.beginPath(); fxCtx.arc(r.x, r.y, r.r, 0, Math.PI*2); fxCtx.stroke();
            });
        }

        function spawnRipple(x, y) { ripples.push({x, y, r: 0, a: 1}); }
        function clearCanvas() { paths = []; activePath = []; showToast("TEMİZLENDİ"); }

    </script>
</body>
</html>
